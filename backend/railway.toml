[build]
builder = "nixpacks"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "node dist/app.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[service]
ports = [{ port = 3000, protocol = "http" }]

[[variables]]
name = "NODE_ENV"
value = "production"

[[variables]]
name = "START_JOBS"
value = "true"
