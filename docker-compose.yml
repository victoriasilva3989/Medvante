version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: medvante-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medvante
      POSTGRES_USER: medvante
      POSTGRES_PASSWORD: medvante
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medvante"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medvante-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: medvante
      DB_USER: medvante
      DB_PASSWORD: medvante
      FRONTEND_URL: http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    volumes:
      - ./backend/certs:/app/certs
    command: >
      sh -c "node dist/migrations/run.js && node dist/app.js"

  frontend:
    image: nginx:alpine
    container_name: medvante-web
    restart: unless-stopped
    ports:
      - "5173:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend

volumes:
  pgdata:
